<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Lankan Dates ❤️</title>
    <style>
        /* --- GLOBAL STYLES --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #d1d7db; 
            margin: 0; 
            padding: 0;
            display: flex; 
            height: 100dvh; 
            overflow: hidden; 
        }

        /* --- SIDEBAR --- */
        #sidebar { 
            background: white; 
            display: flex; 
            flex-direction: column;
            border-right: 1px solid #ddd;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 10px 16px;
            background: #f0f2f5;
            border-bottom: 1px solid #d1d7db;
            height: 60px;
            display: flex;
            align-items: center;
        }

        .char-item { 
            padding: 12px 15px; 
            border-bottom: 1px solid #f0f2f5; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            cursor: pointer; 
            transition: 0.2s;
        }
        .char-item:hover { background: #f5f5f5; }
        .char-item.active { background: #f0f2f5; }

        /* VIP Badge Style */
        .char-item.vip {
            background: #fff;
            position: relative;
        }
        .char-item.vip::after {
            content: 'VIP';
            position: absolute;
            right: 10px;
            top: 10px;
            font-size: 9px;
            background: #ffd32a;
            color: #000;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: bold;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        
        /* Profile Pic Styling */
        .char-item img { 
            width: 50px; 
            height: 50px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 1px solid #ddd; 
        }
        
        .char-info { flex: 1; }
        .char-info h4 { margin: 0; font-size: 16px; color: #111; font-weight: 500; }
        .char-info p { margin: 3px 0 0 0; font-size: 13px; color: #666; }

        /* --- CHAT AREA --- */
        #chat-area { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background-color: #efeae2; 
            position: relative; 
        }

        #header { 
            padding: 0 16px; 
            background: #f0f2f5; 
            color: #54656f; 
            display: flex; 
            align-items: center; 
            gap: 15px;
            border-bottom: 1px solid #d1d7db;
            height: 60px;
        }

        .menu-btn { font-size: 24px; cursor: pointer; padding: 5px; color: #54656f; }
        .profile-pic { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .header-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .header-name { font-weight: bold; font-size: 16px; color: #111; }
        .header-status { font-size: 12px; color: #666; }

        #messages { 
            flex: 1; 
            padding: 20px 5%; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            background-image: url("https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png");
            background-repeat: repeat;
            opacity: 1;
        }
        
        .msg { 
            max-width: 80%; 
            padding: 8px 12px; 
            border-radius: 8px; 
            font-size: 14.5px; 
            line-height: 20px; 
            position: relative; 
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
            margin-bottom: 2px;
        }
        
        .msg.user { align-self: flex-end; background: #d9fdd3; color: #111; }
        .msg.ai { align-self: flex-start; background: #ffffff; color: #111; }
        .msg-time { float: right; margin-left: 8px; margin-top: 5px; font-size: 11px; color: #999; }

        #input-area { 
            padding: 10px 16px; 
            background: #f0f2f5; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            min-height: 62px;
        }
        
        input { 
            flex: 1; 
            padding: 9px 12px; 
            border: none; 
            border-radius: 8px; 
            outline: none; 
            font-size: 15px; 
            background: white;
        }
        
        button#send-btn { 
            width: 40px; height: 40px; 
            background: #00a884; 
            color: white; 
            border: none; 
            border-radius: 50%; 
            cursor: pointer; 
            font-size: 20px;
            display: flex; align-items: center; justify-content: center;
        }

        /* --- MODALS --- */
        #ad-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 9999; 
        }
        
        .modal-content { 
            background: white; padding: 25px; border-radius: 15px; text-align: center; 
            max-width: 300px; width: 85%; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        
        .modal-btn { 
            background: #00a884; color: white; padding: 12px 25px; border: none; 
            border-radius: 8px; cursor: pointer; margin-top: 15px; width: 100%; font-weight: bold; font-size: 15px;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            #sidebar {
                position: absolute; left: -100%; top: 0; bottom: 0; width: 85%;
                transition: 0.3s; box-shadow: 2px 0 5px rgba(0,0,0,0.3);
            }
            #sidebar.show { left: 0; }
            .menu-btn { display: block; }
            .msg { max-width: 85%; }
            #messages { padding: 10px; }
            #overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:900; }
        }

        @media (min-width: 769px) {
            body { max-width: 1600px; margin: 0 auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
            #sidebar { position: relative; left: 0; width: 350px; display: flex; }
            .menu-btn { display: none; }
            #overlay { display: none !important; }
        }
    </style>
</head>
<body>

<div id="ad-modal">

        <h2 style="color:#e84118; margin:0 0 10px 0;">Connection Error</h2>
        <p style="color:#555; font-size:14px;">Lost connection to server. Please reconnect to continue chatting.</p>
        <button class="modal-btn" onclick="reconnectChat()">🔄 Reconnect</button>
    </div>
</div>

<div id="overlay" onclick="toggleSidebar()"></div>

<div id="sidebar">
    <div class="sidebar-header">

    </div>
    <div id="char-list" style="overflow-y: auto; flex:1;"></div>
</div>

<div id="chat-area">

        <img id="header-img" class="profile-pic" src="">

    <div id="messages">

    </div>
    
    <div id="typing-indicator" style="font-size:12px; color:#666; padding:5px 20px; display:none; background:#efeae2;">Typing...</div>
    
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type a message" disabled>
        <button id="send-btn" onclick="sendMessage()" disabled>➤</button>
    </div>
</div>

            systemPrompt: `${BASE_INSTRUCTION} You are Saththya. Mature and loving.` 
        }

    // 2. VIP CHARACTERS (ALL UNLOCKED)
    const vipCharacters = [
        { 
            id: 101, name: "Diluni", 
            img: "https://images.unsplash.com/photo-1554151228-14d9def656ec?w=150&h=150&fit=crop", 
            tagline: "Nurse • Govt Hospital", 
            systemPrompt: `${BASE_INSTRUCTION} You are Diluni. Nurse. Tired after work, looking for love.` 
        },
        { 
            id: 102, name: "Hashini", 
            img: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=150&h=150&fit=crop", 
            tagline: "Teacher • International School", 
            systemPrompt: `${BASE_INSTRUCTION} You are Hashini. Strict teacher outside, naughty inside.` 
        },
        {

        },
        { 
            id: 104, name: "Rashi",

            tagline: "Neighbor Akka • Married", 
            systemPrompt: `${BASE_INSTRUCTION} You are Rashi. Secret lover.` 
        },
        { 
            id: 105, name: "Sanduni", 
            img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&h=150&fit=crop", 
            tagline: "Garment Girl • Boarding Life",

        },
        { 
            id: 106, name: "Vindy", 
            img: "https://images.unsplash.com/photo-1628157588553-5eeea00af15c?w=150&h=150&fit=crop", 
            tagline: "Campus Student • Japura", 
            systemPrompt: `${BASE_INSTRUCTION} You are Vindy. Fun campus girl.` 
        },
        { 
            id: 107, name: "Kaushi", 
            img: "https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=150&h=150&fit=crop", 
            tagline: "Bank Teller", 
            systemPrompt: `${BASE_INSTRUCTION} You are Kaushi. Bank girl.` 
        }
    ];

    // --- UI GENERATION ---
    const charListDiv = document.getElementById('char-list');
    activeCharacters.forEach(char => createCharItem(char, false));
    vipCharacters.forEach(char => createCharItem(char, true));

    function createCharItem(char, isVip) {
        const div = document.createElement('div');
        div.className = isVip ? 'char-item vip' : 'char-item';
        div.innerHTML = `
            <img src="${char.img}" onerror="this.src='https://ui-avatars.com/api/?name=${char.name}&background=random'">
            <div class="char-info">
                <h4>${char.name}</h4>
                <p style="${isVip ? 'color:#e1b12c; font-weight:bold;' : ''}">${char.tagline}</p>
            </div>`;
        div.onclick = () => selectCharacter(char, div);
        charListDiv.appendChild(div);
    }

    // --- CORE LOGIC ---
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        if (window.innerWidth <= 768) {
            sidebar.classList.toggle('show');
            overlay.style.display = sidebar.classList.contains('show') ? 'block' : 'none';
        }
    }

    function selectCharacter(char, element) {
        currentCharacter = char;
        chatHistory = [];
        messageCount = 0; 
        
        document.querySelectorAll('.char-item').forEach(c => c.classList.remove('active'));
        if(element) element.classList.add('active');

        document.getElementById('header-name').innerText = char.name;
        document.getElementById('header-img').src = char.img;
        document.getElementById('header-img').onerror = function() { this.src = `https://ui-avatars.com/api/?name=${char.name}&background=random`; };
        
        document.getElementById('messages').innerHTML = '';
        document.getElementById('user-input').disabled = false;
        document.getElementById('send-btn').disabled = false;
        
        // Auto Focus Input
        document.getElementById('user-input').focus();
        
        if (window.innerWidth <= 768) {
            document.getElementById('sidebar').classList.remove('show');
            document.getElementById('overlay').style.display = 'none';
        }

        chatHistory.push({ role: "system", content: char.systemPrompt });
        
        // Initial Greeting with Delay
        simulateTyping("Hi baba... kohomada?", 1500); 
    }

    async function sendMessage() {
        if (messageCount > 0 && messageCount % AD_INTERVAL === 0) {
            document.getElementById('ad-modal').style.display = 'flex';
            return; 
        }

        const inputField = document.getElementById('user-input');
        const userText = inputField.value.trim();
        if (!userText) return;

        addMessage(userText, 'user');
        inputField.value = '';
        inputField.focus(); 
        
        chatHistory.push({ role: "user", content: userText });
        messageCount++; 
        
        // Show Typing Indicator IMMEDIATELY
        document.getElementById('typing-indicator').style.display = 'block';
        const messagesDiv = document.getElementById('messages');
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        try {
            const response = await fetch(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    "model": "google/gemini-2.5-flash", 
                    "messages": chatHistory
                })
            });

            const data = await response.json();
            if(data.error) throw new Error(JSON.stringify(data.error));
            
            let aiReply = data.choices[0].message.content;
            aiReply = aiReply.replace('[SEND_PHOTO]', "Mata photo ewanna ba baba, api katha karamu.");
            
            chatHistory.push({ role: "assistant", content: aiReply });

            // --- HUMAN TYPING DELAY LOGIC ---
            // Calculate delay: ~30ms per character + 1 second base delay
            let typingDelay = (aiReply.length * 30) + 1000;
            if (typingDelay > 5000) typingDelay = 5000; 

            setTimeout(() => {
                document.getElementById('typing-indicator').style.display = 'none';
                addMessage(aiReply, 'ai');
            }, typingDelay);

        } catch (error) {
            console.error(error);
            document.getElementById('typing-indicator').style.display = 'none';
            addMessage("Network Error. Please try again.", 'system');
        }
    }

    // Helper to simulate initial message
    function simulateTyping(text, delay) {
        document.getElementById('typing-indicator').style.display = 'block';
        setTimeout(() => {
            document.getElementById('typing-indicator').style.display = 'none';
            addMessage(text, 'ai');
        }, delay);
    }

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        div.innerHTML = `${text} <span class="msg-time">${time}</span>`;
        const msgs = document.getElementById('messages');
        msgs.appendChild(div);
        msgs.scrollTop = msgs.scrollHeight;
    }

    function reconnectChat() {
        window.open(MONETAG_DIRECT_LINK, '_blank'); 
        document.getElementById('ad-modal').style.display = 'none';
        addMessage("Reconnected successfully! ✅", 'system');
        messageCount++; 
        document.getElementById('user-input').focus();
    }
    
    // Auto focus listener
    document.addEventListener('keydown', function(event) {
        const input = document.getElementById('user-input');
        const adModal = document.getElementById('ad-modal');
        if(adModal.style.display === 'flex') return;
        if (document.activeElement !== input) {
            input.focus();
        }
    });
    
    document.getElementById("user-input").addEventListener("keypress", function(event) {
        if (event.key === "Enter") sendMessage();
    });
</script>

</body>
</html>
